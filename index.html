<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Money</title>
<style>
:root{
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --sunken:#EDF1F6;
  --line:#E1E7EF;
  --text:#111C2B;
  --muted:#5E7085;
  --faint:#8797AB;
  --need:#3C6DB0;
  --want:#BF7A2A;
  --save:#2A8B69;
  --rose:#C0453F;
  --accent:#1F5FA8;
  --shadow:0 1px 2px rgba(17,28,43,.06);
  --gut:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1520;
    --surface:#19212F;
    --sunken:#141B27;
    --line:#28313F;
    --text:#EDF1F6;
    --muted:#9AAABE;
    --faint:#71839A;
    --need:#6E9FE0;
    --want:#E0A95E;
    --save:#5CC4A0;
    --rose:#E8807A;
    --accent:#7FB0EE;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;letter-spacing:-0.005em;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.015em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{
  font-family:inherit;font-size:17px;color:var(--text);
  background:var(--sunken);border:1px solid transparent;border-radius:10px;
  padding:10px 12px;min-height:44px;
}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
button:focus-visible,[data-open]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top) + 12px) var(--gut) 12px;
  display:flex;align-items:center;gap:12px;
}
header h1{font-size:20px;flex:1;letter-spacing:-0.02em}
.monthnav{display:flex;align-items:center;background:var(--sunken);border-radius:12px;padding:2px}
.monthnav button{width:38px;height:36px;border-radius:10px;color:var(--muted);font-size:19px;line-height:1}
.monthnav button:active{background:var(--surface)}
.monthnav span{min-width:66px;text-align:center;font-size:14px;font-weight:500}

main{padding:4px var(--gut) 40px;max-width:620px;margin:0 auto}
.view{display:none}
.view.on{display:block}

.hero{padding:14px 0 4px}
.hero .label{font-size:14px;color:var(--muted)}
.hero .figure{font-size:46px;font-weight:640;letter-spacing:-0.04em;line-height:1.05;margin:8px 0 6px}
.hero .sub{font-size:14px;color:var(--muted)}
.hero .sub b{font-weight:500;color:var(--text)}

.bar{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--sunken);margin:22px 0 14px;gap:2px}
.bar i{display:block;height:100%;border-radius:5px}
.split3{display:flex;gap:8px;margin-bottom:30px}
.split3 div{flex:1}
.split3 .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.split3 .v{font-size:19px;font-weight:600;letter-spacing:-0.02em;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

h2.sec{
  font-size:13px;font-weight:600;color:var(--faint);
  margin:32px 0 8px;letter-spacing:0;
}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.panel + .ghost{margin-top:12px}

.row{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.row .name{flex:1;min-width:0;font-size:17px}
.row .name small{display:block;font-size:13px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.row .amt{font-size:17px;font-weight:600;letter-spacing:-0.015em}
.row .amt.dim{font-weight:400;color:var(--muted)}
.row .chev{color:var(--faint);font-size:15px;flex:none}
.row.sum{background:var(--sunken)}
.row.sum .name{color:var(--muted);font-size:15px}
.tag{font-size:12px;color:var(--muted);background:var(--sunken);border-radius:6px;padding:3px 7px;flex:none}
.panel .row .tag{background:var(--bg)}

.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px;font-size:17px;position:relative}
.kv + .kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.kv span{color:var(--muted);font-size:15px}
.kv b{font-weight:600;letter-spacing:-0.015em}
.kv input{width:130px;text-align:right;margin:-6px 0}
.note{font-size:14px;color:var(--muted);line-height:1.5;padding:14px 16px;background:var(--sunken)}
.hint{font-size:14px;color:var(--muted);margin:10px 2px 0;line-height:1.5}

.edit{display:none;padding:4px 16px 16px;background:var(--sunken)}
.edit.on{display:block}
.edit .line{display:flex;gap:8px;margin-bottom:10px}
.edit .line input[type=text]{flex:1;min-width:0}
.edit .line input[type=number]{width:110px;text-align:right}
.edit .line select{flex:0 0 108px}
.whenrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whenrow label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.whenrow label.wide{grid-column:1 / -1}
.editfoot{display:flex;gap:20px;justify-content:flex-end;align-items:center;margin-top:14px;font-size:15px}
.editfoot .undo{color:var(--accent)}
.editfoot .del{color:var(--rose)}

.ghost{
  display:block;width:100%;text-align:center;
  border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:16px;color:var(--muted);background:var(--surface);
  margin-top:10px;min-height:48px;
}
.ghost:active{background:var(--sunken)}
.ghost.primary{color:var(--accent);border-color:transparent;background:var(--surface);font-weight:500}

.pill{font-size:13px;font-weight:500;border-radius:8px;padding:4px 9px;background:var(--sunken);color:var(--muted)}
.pill.warn{color:var(--rose)}
.pill.good{color:var(--save)}

.gauge{padding:16px}
.gauge .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.gauge .top .t{font-size:15px;color:var(--muted)}
.gauge .pc{font-size:30px;font-weight:640;letter-spacing:-0.03em}
.gauge .track{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;position:relative}
.gauge .track i{display:block;height:100%;border-radius:4px}
.gauge .track u{position:absolute;top:-3px;width:2px;height:14px;background:var(--text);opacity:.35;border-radius:1px}
.gauge .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}

.pot{padding:13px 16px;position:relative}
.pot + .pot::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.pot .top{display:flex;align-items:center;gap:10px}
.pot .top .name{flex:1;font-size:17px}
.pot input{width:126px;text-align:right;margin:-4px 0}
.pot .meta{font-size:13px;margin-top:5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pot .meta.up{color:var(--save)}
.pot .meta.down{color:var(--rose)}
.pot .x{color:var(--faint);font-size:20px;width:28px;text-align:right;flex:none}
svg.spark{display:block;width:100%;height:120px;margin:14px 0 6px;overflow:visible}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{padding:9px 2px 10px;font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(6px);
  background:var(--text);color:var(--bg);border-radius:12px;padding:11px 18px;font-size:15px;
  opacity:0;transition:opacity .18s ease, transform .18s ease;pointer-events:none;z-index:40;
  max-width:80%;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sharebtn{margin-top:22px}
.shareinner{display:inline-flex;align-items:center;gap:9px}
.shareinner svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<header>
  <h1 id="title">This month</h1>
  <div class="monthnav">
    <button id="prev" aria-label="Previous month">&#8249;</button>
    <span class="num" id="mlabel"></span>
    <button id="next" aria-label="Next month">&#8250;</button>
  </div>
</header>

<main>
  <section class="view on" id="v-month"></section>
  <section class="view" id="v-accounts"></section>
  <section class="view" id="v-joint"></section>
  <section class="view" id="v-rule"></section>
  <section class="view" id="v-savings"></section>
</main>

<nav>
  <button data-v="month" class="on"><svg viewBox="0 0 24 24"><path d="M3 13h3.5l2.5 5 3.5-11 2.5 6h6"/></svg>Month</button>
  <button data-v="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/></svg>Accounts</button>
  <button data-v="joint"><svg viewBox="0 0 24 24"><circle cx="9.5" cy="9" r="3"/><circle cx="16.5" cy="10.5" r="2.3"/><path d="M4 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8M15.5 19.5c0-2.1 1.1-3.3 2.7-3.3s2.3 1.2 2.3 3.3"/></svg>Joint</button>
  <button data-v="rule"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5l6 4"/></svg>50/30/20</button>
  <button data-v="savings"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16"/><path d="M8 15.5l3.5-4.5 3 2.5L20 7"/></svg>Savings</button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";

const store = (() => {
  const mem = {};
  const hasW = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
  let hasLS = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); hasLS = true; } catch (e) { hasLS = false; }
  return {
    async get(k){
      if (hasW) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch(e){ return null; } }
      if (hasLS) return localStorage.getItem(k);
      return mem[k] || null;
    },
    async set(k,v){
      if (hasW) { try { await window.storage.set(k,v); return; } catch(e){} }
      if (hasLS) { try { localStorage.setItem(k,v); return; } catch(e){} }
      mem[k] = v;
    }
  };
})();

const KEY = "money.v1";
const EPOCH = "2000-01";
const CAT = { need:"Need", want:"Want", save:"Save" };
const CATP = { need:"Needs", want:"Wants", save:"Saving" };
const cvar = k => getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim() || "#888";

const uid = () => Math.random().toString(36).slice(2,9);
const money = n => "£" + (Math.round(n*100)/100).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "£" + Math.round(n).toLocaleString("en-GB");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function seed(){
  return {
    v:2, partner:"Partner",
    income:[{m:EPOCH,v:0}], otherIncome:[{m:EPOCH,v:0}],
    accounts:[
      {id:"a1",name:"Main account"},
      {id:"a2",name:"Subscriptions"},
      {id:"a3",name:"Personal"},
      {id:"a4",name:"Joint account"}
    ],
    groups:[
      {id:"g55",name:"Uneven split",splits:[{m:EPOCH,mine:55}]},
      {id:"g50",name:"Even split",splits:[{m:EPOCH,mine:50}]}
    ],
    transfers:[{m:EPOCH,mine:0,theirs:0}],
    items:[], pots:[], balances:{},
    targets:{need:50,want:30,save:20}, lastBackup:null
  };
}

let S = seed(), view = "month", editing = null;
let cursor = new Date(); cursor.setDate(1);

const mkey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const mname = d => d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const mshort = d => d.toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
const shiftKey = (k,n) => { const [y,m] = k.split("-").map(Number); return mkey(new Date(y, m-1+n, 1)); };
const prettyKey = k => { const [y,m] = k.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"short",year:"2-digit"}); };
let K = mkey(cursor);

function at(series, m){
  if (!series || !series.length) return null;
  let out = null;
  series.slice().sort((a,b) => a.m < b.m ? -1 : 1).forEach(e => { if (e.m <= m) out = e; });
  return out;
}
function setAt(series, m, patch){
  const existing = series.find(e => e.m === m);
  if (existing) Object.assign(existing, patch);
  else series.push(Object.assign({}, at(series, m) || {}, patch, {m}));
  series.sort((a,b) => a.m < b.m ? -1 : 1);
}

async function save(){ await store.set(KEY, JSON.stringify(S)); }
function migrate(p){
  if (!p || p.v === 2) return p;
  const num = v => ({m:EPOCH, v:Number(v)||0});
  p.income = [num(p.income)];
  p.otherIncome = [num(p.otherIncome)];
  p.transfers = [{m:EPOCH, mine:Number((p.transfers||{}).mine)||0, theirs:Number((p.transfers||{}).theirs)||0}];
  (p.groups||[]).forEach(g => { g.splits = [{m:EPOCH, mine:g.mine != null ? g.mine : 50}]; delete g.mine; });
  (p.items||[]).forEach(it => { it.amounts = [{m:EPOCH, v:Number(it.amount)||0}]; it.from = null; it.to = null; delete it.amount; });
  delete p.future; p.v = 2; return p;
}
async function load(){
  const raw = await store.get(KEY);
  if (raw) { try { const p = migrate(JSON.parse(raw)); if (p && p.items) S = p; } catch(e){} }
}

/* ---------- resolution as at month K ---------- */
const active = it => (!it.from || it.from <= K) && (!it.to || it.to >= K);
const amtIn = (it,m) => { const e = at(it.amounts, m); return e ? e.v : 0; };
const amt = it => amtIn(it, K);
const grp = id => S.groups.find(g => g.id === id);
const splitOf = g => { const e = at(g.splits, K); return e ? e.mine : 100; };
function myShare(it){
  if (!it.group) return amt(it);
  const g = grp(it.group);
  return amt(it) * (g ? splitOf(g) : 100) / 100;
}
const liveItems = () => S.items.filter(active);
function jointId(){
  const withGroup = S.items.find(i => i.group);
  if (withGroup) return withGroup.acct;
  const named = S.accounts.find(a => /joint/i.test(a.name));
  return named ? named.id : null;
}
const soloAccounts = () => S.accounts.filter(a => a.id !== jointId());
const income = () => { const a = at(S.income,K), b = at(S.otherIncome,K); return (a?a.v:0) + (b?b.v:0); };
const transfers = () => at(S.transfers,K) || {mine:0,theirs:0};
const jointCosts = () => liveItems().filter(i => i.acct === jointId()).reduce((s,i) => s + amt(i), 0);
const jointMine = () => liveItems().filter(i => i.acct === jointId()).reduce((s,i) => s + myShare(i), 0);
const soloTotal = id => liveItems().filter(i => i.acct === id).reduce((s,i) => s + myShare(i), 0);

/* cash actually leaving my accounts: solo payments plus the standing order */
function committed(){
  const solo = soloAccounts().reduce((s,a) => s + soloTotal(a.id), 0);
  return solo + (jointId() ? transfers().mine : 0);
}
/* need / want / save, with any joint overpayment treated as an earmarked need */
function totals(){
  const t = {need:0,want:0,save:0};
  liveItems().forEach(it => { t[it.cat] += myShare(it); });
  const buffer = jointId() ? Math.max(transfers().mine - jointMine(), 0) : 0;
  t.buffer = buffer;
  t.need += buffer;
  t.all = t.need + t.want + t.save;
  t.left = income() - t.all;
  return t;
}
function changes(){
  const prev = shiftKey(K,-1), out = [];
  S.items.forEach(it => {
    const wasOn = (!it.from || it.from <= prev) && (!it.to || it.to >= prev);
    const isOn = active(it);
    if (isOn && !wasOn) out.push({name:it.name, kind:"started", now:amt(it)});
    else if (!isOn && wasOn) out.push({name:it.name, kind:"ended", was:amtIn(it,prev)});
    else if (isOn && wasOn) {
      const a = amtIn(it,prev), b = amt(it);
      if (Math.abs(a-b) > 0.004) out.push({name:it.name, kind:"changed", was:a, now:b});
    }
  });
  const ia = at(S.income,prev), ib = at(S.income,K);
  if (ia && ib && Math.abs(ia.v-ib.v) > 0.004) out.push({name:"Salary", kind:"changed", was:ia.v, now:ib.v});
  return out;
}

/* ---------- savings, carried forward ---------- */
function balAt(potId, m){
  const months = Object.keys(S.balances).filter(x => x <= m).sort();
  for (let i = months.length-1; i >= 0; i--){
    const v = S.balances[months[i]][potId];
    if (v != null) return {v:Number(v), m:months[i]};
  }
  return null;
}
const potTotal = m => S.pots.reduce((s,p) => { const b = balAt(p.id,m); return s + (b ? b.v : 0); }, 0);
function savingsSeries(){
  const months = Object.keys(S.balances).sort().filter(m => m <= K);
  if (!months.length) return {labels:[],vals:[]};
  const labels = []; let m = months[0];
  while (m <= K && labels.length < 60) { labels.push(m); m = shiftKey(m,1); }
  return {labels, vals: labels.map(potTotal)};
}

/* ---------- render ---------- */
function render(){
  K = mkey(cursor);
  document.getElementById("mlabel").textContent = mshort(cursor);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-"+view));
  ({month:renderMonth,accounts:renderAccounts,joint:renderJoint,rule:renderRule,savings:renderSavings})[view]();
  addShare();
}
function addShare(){
  const host = document.getElementById("v-"+view);
  if (!host || host.querySelector(".sharebtn")) return;
  const b = document.createElement("button");
  b.className = "ghost sharebtn";
  b.innerHTML = '<span class="shareinner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8.5 7.5M12 4l3.5 3.5"/><path d="M5 13v5.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>Share this as a PDF</span>';
  b.onclick = sharePdf;
  host.appendChild(b);
}

function splitBar(t){
  const base = Math.max(income(), t.all) || 1;
  const seg = k => t[k] > 0 ? `<i style="width:${t[k]/base*100}%;background:var(--${k})"></i>` : "";
  return `<div class="bar">${seg("need")}${seg("want")}${seg("save")}</div>
  <div class="split3">
    ${["need","want","save"].map(k => `<div>
      <div class="k"><i class="dot" style="background:var(--${k})"></i>${CATP[k]}</div>
      <div class="v num">${money0(t[k])}</div></div>`).join("")}
  </div>`;
}
const stale = () => !S.lastBackup ? S.items.length > 0
  : (Date.now() - new Date(S.lastBackup).getTime()) > 40*24*3600*1000;

function renderMonth(){
  const t = totals(), ch = changes(), tr = transfers(), jid = jointId();
  const cash = committed(), left = income() - cash;
  document.getElementById("title").textContent = mname(cursor);
  document.getElementById("v-month").innerHTML = `
    ${S.items.length ? "" : `<div class="panel"><div class="note">
      Nothing set up yet. Restore a backup below, or open Accounts and add your payments.</div></div>`}
    <div class="hero">
      <div class="label">Left to spend</div>
      <div class="figure num">${money(left)}</div>
      <div class="sub num"><b>${money(income())}</b> in, <b>${money(cash)}</b> out</div>
    </div>
    ${splitBar(t)}
    <h2 class="sec">Leaving your accounts</h2>
    <div class="panel">
      ${soloAccounts().map(a => `<div class="row">
        <div class="name">${esc(a.name)}</div>

function itemRows(list, showShare){
  const prev = shiftKey(K,-1);
  return list.map(it => {
    const g = it.group ? grp(it.group) : null;
    const was = amtIn(it,prev);
    const moved = (!it.from || it.from <= prev) && Math.abs(was - amt(it)) > 0.004;
    const pinned = it.amounts.some(e => e.m === K) && it.amounts.length > 1;
    const sub = [];
    if (showShare && g) sub.push(`your ${splitOf(g)}% is ${money(myShare(it))}`);
    if (moved) sub.push(`was ${money(was)}`);
    if (it.to) sub.push(`ends ${prettyKey(it.to)}`);
    return `<div class="row" data-open="${it.id}" role="button" tabindex="0">
      <div class="name">${esc(it.name)}${sub.length ? `<small>${sub.join(" · ")}</small>` : ""}</div>
      <span class="tag">${CAT[it.cat]}</span>
      <div class="amt num">${money(amt(it))}</div>
      <span class="chev">${editing===it.id?"⌃":"⌄"}</span>
    </div>
    <div class="edit${editing===it.id?" on":""}">
      <div class="line">
        <input type="text" value="${esc(it.name)}" data-name="${it.id}" aria-label="Name">

      </div>
      <div class="line">

}

function spark(labels, vals){
  if (vals.length < 2) return "";
  const w = 340, h = 110, pad = 6;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const x = i => pad + i*(w-pad*2)/(vals.length-1);
  const y = v => h - pad - ((v-min)/span)*(h-pad*2);
  const pts = vals.map((v,i) => [x(i),y(v)]);
  let line = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++){
    const [px,py] = pts[i-1], [cx,cy] = pts[i], mx = (px+cx)/2;
    line += ` C${mx.toFixed(1)} ${py.toFixed(1)} ${mx.toFixed(1)} ${cy.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
  }
  const c = cvar("save");
  return `<svg class="spark" viewBox="0 0 ${w} ${h+18}" preserveAspectRatio="none" role="img" aria-label="Total savings over time">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".22"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line} L${x(vals.length-1).toFixed(1)} ${h} L${pad} ${h} Z" fill="url(#g)"/>
    <path d="${line}" stroke="${c}" fill="none" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(vals.length-1).toFixed(1)}" cy="${y(vals[vals.length-1]).toFixed(1)}" r="3.5" fill="${c}"/>
    <text x="${pad}" y="${h+15}" fill="${cvar("faint")}" font-size="11">${prettyKey(labels[0])}</text>
    <text x="${w-pad}" y="${h+15}" fill="${cvar("faint")}" font-size="11" text-anchor="end">${prettyKey(labels[labels.length-1])}</text>
  </svg>`;
}

/* ---------- PDF: a small writer, no libraries, base-14 Helvetica ---------- */
const W = (() => {
  const t = {};
  " !\"#$%&'()*+,-./".split("").forEach((c,i) => t[c] = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278][i]);
  "0123456789".split("").forEach(c => t[c] = 556);
  ":;<=>?@".split("").forEach((c,i) => t[c] = [278,278,584,584,584,556,1015][i]);
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach((c,i) => t[c] =
    [667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611][i]);
  "[\\]^_`".split("").forEach((c,i) => t[c] = [278,278,278,469,556,333][i]);
  "abcdefghijklmnopqrstuvwxyz".split("").forEach((c,i) => t[c] =
    [556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500][i]);
  "{|}~".split("").forEach((c,i) => t[c] = [334,260,334,584][i]);
  t["\u00A3"] = 556; t["\u00B7"] = 278; t["\u2019"] = 191; t["\u2013"] = 556; t["\u2212"] = 584;
  return t;
})();
const textWidth = (s, size) => {
  let w = 0;
  for (const c of String(s)) w += (W[c] != null ? W[c] : 500);
  return w * size / 1000;
};
/* map to WinAnsi single bytes, drop anything we cannot encode */
function winansi(s){
  const map = {"\u00A3":0xA3,"\u00B7":0xB7,"\u2019":0x92,"\u2018":0x91,"\u201C":0x93,"\u201D":0x94,
               "\u2013":0x96,"\u2014":0x97,"\u2212":0x2D,"\u00A0":0x20,"\u00E9":0xE9,"\u00A9":0xA9};
  let out = "";
  for (const c of String(s)){
    const n = c.charCodeAt(0);
    if (n >= 32 && n <= 126) out += c;
    else if (map[c] != null) out += String.fromCharCode(map[c]);
    else if (n >= 160 && n <= 255) out += c;
    else out += " ";
  }
  return out;
}
const pdfEsc = s => winansi(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");

function buildPdf(doc){
  const PW = 595.28, PH = 841.89, M = 52;
  const pages = [];
  let ops = [], y = 0, pageNo = 0;

  const startPage = () => {
    pageNo++;
    ops = [];
    y = PH - M;
    if (pageNo === 1){
      ops.push(`BT 0 g /F2 20 Tf 1 0 0 1 ${M} ${y-6} Tm (${pdfEsc(doc.title)}) Tj ET`);
      y -= 26;
      if (doc.subtitle){
        ops.push(`BT 0.38 g /F1 11 Tf 1 0 0 1 ${M} ${y-4} Tm (${pdfEsc(doc.subtitle)}) Tj ET`);
        y -= 22;
      }
      y -= 6;
    }
  };
  const room = need => { if (y - need < M + 34){ pages.push(ops); startPage(); } };
  const rule = () => {
    ops.push(`0.86 G 0.6 w ${M} ${y.toFixed(1)} m ${(PW-M).toFixed(1)} ${y.toFixed(1)} l S`);
  };
  const left = (s, size, font, grey, dy) => {
    ops.push(`BT ${grey} g /${font} ${size} Tf 1 0 0 1 ${M} ${(y-dy).toFixed(1)} Tm (${pdfEsc(s)}) Tj ET`);
  };
  const right = (s, size, font, grey, dy) => {
    const x = PW - M - textWidth(s, size);
    ops.push(`BT ${grey} g /${font} ${size} Tf 1 0 0 1 ${x.toFixed(1)} ${(y-dy).toFixed(1)} Tm (${pdfEsc(s)}) Tj ET`);
  };
  const wrap = (s, size, width) => {
    const words = String(s).split(/\s+/), lines = []; let cur = "";
    words.forEach(w => {
      const test = cur ? cur + " " + w : w;
      if (textWidth(test, size) > width && cur){ lines.push(cur); cur = w; } else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  };

  startPage();
  doc.blocks.forEach(b => {
    if (b.type === "section"){
      room(40);
      y -= 16;
      left(b.text, 10, "F2", "0.42", 0);
      y -= 8;
      rule();
      y -= 4;
    } else if (b.type === "note"){
      const lines = wrap(b.text, 9.5, PW - M*2);
      room(lines.length * 13 + 8);
      y -= 6;
      lines.forEach(l => { left(l, 9.5, "F1", "0.45", 0); y -= 13; });
    } else {
      const hasSub = !!b.sub;
      room(hasSub ? 34 : 24);
      y -= 16;
      const size = b.strong ? 11 : 10.5;
      left(b.label, size, b.strong ? "F2" : "F1", b.strong ? "0" : "0.15", 0);
      if (b.value != null) right(String(b.value), size, "F2", b.grey || "0", 0);
      if (hasSub){ y -= 12; left(b.sub, 8.8, "F1", "0.5", 0); }
      y -= 7;
      if (!b.last) rule();
    }
  });
  pages.push(ops);

  /* footers */
  const stamp = doc.stamp || "";
  const streams = pages.map((o,i) => {
    const f = `BT 0.55 g /F1 8.5 Tf 1 0 0 1 ${M} ${M-14} Tm (${pdfEsc(stamp)}) Tj ET`;
    const lbl = `${i+1} of ${pages.length}`;
    const g = `BT 0.55 g /F1 8.5 Tf 1 0 0 1 ${(PW-M-textWidth(lbl,8.5)).toFixed(1)} ${M-14} Tm (${pdfEsc(lbl)}) Tj ET`;
    return o.concat([f,g]).join("\n");
  });

  /* assemble */
  const objs = [];
  const nPages = streams.length;
  const pageIds = streams.map((_,i) => 4 + i*2);
  objs[1] = `<< /Type /Catalog /Pages 2 0 R >>`;
  objs[2] = `<< /Type /Pages /Kids [${pageIds.map(id => id+" 0 R").join(" ")}] /Count ${nPages} >>`;
  objs[3] = `<< /Font << /F1 ${4+nPages*2} 0 R /F2 ${5+nPages*2} 0 R >> >>`;
  streams.forEach((s,i) => {
    objs[pageIds[i]] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources 3 0 R /Contents ${pageIds[i]+1} 0 R >>`;
    objs[pageIds[i]+1] = `<< /Length ${s.length} >>\nstream\n${s}\nendstream`;
  });
  objs[4+nPages*2] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[5+nPages*2] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;

  let out = "%PDF-1.4\n";
  const offsets = [];
  for (let i = 1; i < objs.length; i++){
    offsets[i] = out.length;
    out += `${i} 0 obj\n${objs[i]}\nendobj\n`;
  }
  const xref = out.length;
  out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let i = 1; i < objs.length; i++){
    out += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  }
  out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;

  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
  return new Blob([bytes], {type:"application/pdf"});
}

/* ---------- what each tab puts in the document ---------- */
function docFor(v){
  const stamp = "Made " + new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const t = totals(), jid = jointId(), tr = transfers();
  const B = [];
  const sec = text => B.push({type:"section",text});
  const row = (label,value,sub,strong,grey) => B.push({type:"row",label,value,sub,strong,grey});
  const note = text => B.push({type:"note",text});

  if (v === "month"){
    const cash = committed();
    sec("Money in");
    const a = at(S.income,K), b = at(S.otherIncome,K);
    row("Salary after tax", money(a?a.v:0));
    if (b && b.v) row("Other income", money(b.v));
    sec("Leaving your accounts");
    soloAccounts().forEach(x => row(x.name, money(soloTotal(x.id))));
    if (jid) row(S.accounts.find(x=>x.id===jid).name, money(tr.mine), "standing order, " + money(jointMine()) + " is your share");
    row("Total out", money(cash), null, true);
    sec("How it splits");
    row("Needs", money(t.need));
    row("Wants", money(t.want));
    row("Saving", money(t.save));
    row("Left to spend", money(income()-cash), null, true);
    const ch = changes();
    if (ch.length){
      sec("Different from " + prettyKey(shiftKey(K,-1)));
      ch.forEach(c => row(c.name,
        c.kind === "started" ? "starts at " + money(c.now) :
        c.kind === "ended" ? "ends, was " + money(c.was) :
        money(c.was) + " to " + money(c.now)));
    }
    return {title: mname(cursor), subtitle: money(income()-cash) + " left to spend", blocks:B, stamp};
  }

  if (v === "accounts"){
    sec("Money in during " + mname(cursor));
    const a = at(S.income,K), b = at(S.otherIncome,K);
    row("Salary after tax", money(a?a.v:0));
    row("Other income", money(b?b.v:0));
    soloAccounts().forEach(x => {
      const list = liveItems().filter(i => i.acct === x.id).sort((p,q) => amt(q)-amt(p));
      sec(x.name + "  ·  " + money(soloTotal(x.id)));
      list.forEach(i => row(i.name, money(amt(i)), CAT[i.cat]));
      row("Subtotal", money(soloTotal(x.id)), null, true);
    });
    if (jid){
      sec(S.accounts.find(x=>x.id===jid).name);
      row("Standing order out", money(tr.mine));
      row("Your share of the bills", money(jointMine()), "the shared bills are listed on the joint sheet");
    }
    row("Total leaving your accounts", money(committed()), null, true);
    return {title:"Accounts", subtitle: mname(cursor), blocks:B, stamp};
  }

  if (v === "joint"){
    const full = jointCosts(), mine = jointMine();
    sec("Standing orders in");
    row("You send", money(tr.mine));
    row(S.partner + " sends", money(tr.theirs));
    row("Buffer built this month", money(tr.mine + tr.theirs - full), null, true);
    S.groups.forEach(g => {
      const list = liveItems().filter(i => i.group === g.id).sort((p,q) => amt(q)-amt(p));
      if (!list.length) return;
      const tot = list.reduce((s,i) => s + amt(i), 0), pc = splitOf(g);
      sec(g.name + "  ·  " + money(tot));
      list.forEach(i => row(i.name, money(amt(i))));
      row("You, " + pc + "%", money(tot*pc/100), null, true);
      row(S.partner + ", " + (100-pc) + "%", money(tot*(100-pc)/100), null, true);
    });
    sec("Altogether");
    row("Leaving the joint account", money(full));
    row("You owe", money(mine), null, true);
    row(S.partner + " owes", money(full-mine), null, true);
    return {title:"Joint account", subtitle: mname(cursor) + "  ·  " + money(full) + " in shared costs", blocks:B, stamp};
  }

  if (v === "rule"){
    const inc = income();
    const pct = n => inc ? (n/inc*100).toFixed(0) + "%" : "0%";
    sec("Against your targets");
    ["need","want","save"].forEach(k => {
      const target = inc * S.targets[k]/100;
      const actual = k === "want" ? t.want + Math.max(t.left,0) : t[k];
      const diff = actual - target;
      row(CATP[k], pct(actual), money(actual) + " against a target of " + money(target) + ", " +
        (diff >= 0 ? "over by " : "under by ") + money(Math.abs(diff)));
    });
    sec("Targets in use");
    ["need","want","save"].forEach(k => row(CATP[k], S.targets[k] + "%"));
    if (inc) note("Needs are " + pct(t.need) + " of what comes in. " +
      (t.buffer > 0.004 ? "That includes " + money(t.buffer) + " of joint account buffer, which is earmarked for bills rather than spent." : ""));
    return {title:"50/30/20", subtitle: mname(cursor), blocks:B, stamp};
  }

  const pk = shiftKey(K,-1);
  const entered = S.balances[K] || {};
  sec("Balances");
  S.pots.forEach(p => {
    const bal = balAt(p.id,K), q = balAt(p.id,pk);
    const fresh = entered[p.id] != null;
    const d = (bal && q) ? bal.v - q.v : null;
    row(p.name, bal ? money(bal.v) : "not recorded",
      !bal ? null : fresh ? (d !== null && Math.abs(d) > 0.004
        ? (d >= 0 ? "up " : "down ") + money(Math.abs(d)) + " since " + prettyKey(pk) : "no change")
        : "carried from " + prettyKey(bal.m));
  });
  const now = potTotal(K), was = potTotal(pk);
  row("Total held", money(now), was ? ((now>=was?"up ":"down ") + money(Math.abs(now-was)) + " on " + prettyKey(pk)) : null, true);
  sec("Paid in from your bills");
  row("Pensions, ISAs and debt", money(liveItems().filter(i => i.cat === "save").reduce((s,i) => s + myShare(i), 0)));
  return {title:"Savings", subtitle: mname(cursor) + "  ·  " + money0(now) + " held", blocks:B, stamp};
}

async function sharePdf(){
  let blob, doc;
  try { doc = docFor(view); blob = buildPdf(doc); }
  catch(e){ toast("Could not build the PDF."); return; }
  const name = doc.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-" + K + ".pdf";
  const file = new File([blob], name, {type:"application/pdf"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:doc.title}); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Saved. Share it from Files.");
}

load().then(render);
