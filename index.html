<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Money</title>
<style>
:root{
  --bg:#F3F5F9;
  --surface:#FFFFFF;
  --sunken:#EBEFF5;
  --line:#E3E8F0;
  --text:#101A28;
  --muted:#5B6D83;
  --faint:#8494A8;
  --accent:#1F5FA8;
  --rose:#BE4239;
  --need:#3C6DB0;  --needSoft:#E7EEF9;
  --want:#B0701C;  --wantSoft:#FAF0DE;
  --save:#237A5C;  --saveSoft:#E1F1EB;
  --glass:rgba(243,245,249,.86);
  --sheetbg:#FFFFFF;
  --shadow:0 1px 2px rgba(16,26,40,.05), 0 6px 18px rgba(16,26,40,.04);
  --lift:0 -8px 40px rgba(16,26,40,.18);
  --gut:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E141E;
    --surface:#18202D;
    --sunken:#131A25;
    --line:#26303E;
    --text:#ECF1F7;
    --muted:#9AAABE;
    --faint:#6F8098;
    --accent:#7FB0EE;
    --rose:#E88079;
    --need:#7FADE8;  --needSoft:#1C2A3C;
    --want:#E0AC69;  --wantSoft:#2C2518;
    --save:#5FC8A4;  --saveSoft:#152B24;
    --glass:rgba(14,20,30,.86);
    --sheetbg:#1B2430;
    --shadow:none;
    --lift:0 -8px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;letter-spacing:-0.005em;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.015em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{
  font-family:inherit;font-size:17px;color:var(--text);
  background:var(--sunken);border:1.5px solid transparent;border-radius:12px;
  padding:11px 13px;min-height:46px;width:100%;
}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}

header{
  position:sticky;top:0;z-index:20;background:var(--glass);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top) + 12px) var(--gut) 12px;
  display:flex;align-items:center;gap:12px;
}
header h1{font-size:21px;flex:1;letter-spacing:-0.025em}
.monthnav{display:flex;align-items:center;background:var(--sunken);border-radius:13px;padding:3px}
.monthnav button{width:38px;height:36px;border-radius:10px;color:var(--muted);font-size:19px;line-height:1}
.monthnav button:active{background:var(--surface)}
.monthnav span{min-width:64px;text-align:center;font-size:14px;font-weight:600}

main{padding:4px var(--gut) 40px;max-width:620px;margin:0 auto}
.view{display:none}
.view.on{display:block}

.hero{padding:16px 0 2px}
.hero .label{font-size:14px;color:var(--muted)}
.hero .figure{font-size:48px;font-weight:650;letter-spacing:-0.042em;line-height:1.02;margin:8px 0 7px}
.hero .sub{font-size:14.5px;color:var(--muted)}
.hero .sub b{font-weight:600;color:var(--text)}

.bar{height:12px;border-radius:6px;display:flex;background:var(--sunken);margin:22px 0 16px;gap:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.split3{display:flex;gap:10px;margin-bottom:26px}
.split3 div{flex:1;background:var(--surface);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow)}
.split3 .k{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.split3 .v{font-size:19px;font-weight:650;letter-spacing:-0.025em;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

h2.sec{font-size:13px;font-weight:600;color:var(--faint);margin:30px 0 9px;display:flex;align-items:center;gap:8px}
h2.sec .amt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

.row{display:flex;align-items:center;gap:11px;padding:14px 16px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.row:active{background:var(--sunken)}
.row .name{flex:1;min-width:0;font-size:17px}
.row .name small{display:block;font-size:13px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.row .amt{font-size:17px;font-weight:600;letter-spacing:-0.015em;font-variant-numeric:tabular-nums}
.row .chev{color:var(--faint);flex:none;width:8px}
.row .chev svg{width:8px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.row.sum{background:var(--sunken)}
.row.sum .name{color:var(--muted);font-size:15px}

.chip{font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;flex:none;letter-spacing:0}
.chip.need{background:var(--needSoft);color:var(--need)}
.chip.want{background:var(--wantSoft);color:var(--want)}
.chip.save{background:var(--saveSoft);color:var(--save)}

.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px;font-size:17px;position:relative}
.kv + .kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.kv > span{color:var(--muted);font-size:15px}
.kv b{font-weight:650;letter-spacing:-0.015em;font-variant-numeric:tabular-nums}
.kv input{width:132px;text-align:right;margin:-5px 0;flex:none}
.note{font-size:14px;color:var(--muted);line-height:1.5;padding:14px 16px;background:var(--sunken)}
.hint{font-size:14px;color:var(--muted);margin:11px 2px 0;line-height:1.5}

.ghost{
  display:block;width:100%;text-align:center;
  border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:16px;color:var(--muted);background:var(--surface);
  margin-top:10px;min-height:50px;
}
.ghost:active{background:var(--sunken)}
.ghost.primary{color:var(--accent);font-weight:550;border-color:transparent;box-shadow:var(--shadow)}
.sharebtn{margin-top:22px}
.shareinner{display:inline-flex;align-items:center;gap:9px}
.shareinner svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.pill{font-size:13px;font-weight:600;border-radius:8px;padding:4px 9px;background:var(--sunken);color:var(--muted)}
.pill.warn{background:var(--wantSoft);color:var(--want)}
.pill.good{background:var(--saveSoft);color:var(--save)}
.pill.over{background:var(--needSoft);color:var(--need)}

.gauge{padding:16px}
.gauge .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gauge .top .t{font-size:15px;color:var(--muted)}
.gauge .pc{font-size:32px;font-weight:660;letter-spacing:-0.035em}
.gauge .track{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;position:relative;margin-top:6px}
.gauge .track i{display:block;height:100%;border-radius:5px}
.gauge .track u{position:absolute;top:-3px;width:2px;height:16px;background:var(--text);opacity:.28;border-radius:1px}
.gauge .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:9px;font-variant-numeric:tabular-nums}

.pot{padding:13px 16px;position:relative}
.pot + .pot::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.pot .top{display:flex;align-items:center;gap:10px}
.pot .top .name{flex:1;font-size:17px}
.pot input{width:130px;text-align:right;margin:-4px 0;flex:none}
.pot .meta{font-size:13px;margin-top:5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pot .meta.up{color:var(--save)}
.pot .meta.down{color:var(--rose)}
.pot .x{color:var(--faint);font-size:22px;width:26px;text-align:right;flex:none;line-height:1}
svg.spark{display:block;width:100%;height:122px;margin:14px 0 6px;overflow:visible}

/* bottom sheet */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(10,16,26,.42);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--sheetbg);border-radius:22px 22px 0 0;box-shadow:var(--lift);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 var(--gut) calc(24px + env(safe-area-inset-bottom));
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px}
.sheethead{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.sheethead h3{font-size:20px;flex:1;letter-spacing:-0.02em}
.sheethead .done{color:var(--accent);font-size:17px;font-weight:600;padding:6px 2px}
.field{margin-bottom:16px}
.field > label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:7px}
.field.big input{font-size:30px;font-weight:650;letter-spacing:-0.03em;text-align:left;padding:12px 14px;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.seg button{
  padding:13px 4px;border-radius:12px;font-size:15px;font-weight:600;
  background:var(--sunken);color:var(--muted);border:1.5px solid transparent;min-height:48px;
}
.seg button.on.need{background:var(--needSoft);color:var(--need);border-color:var(--need)}
.seg button.on.want{background:var(--wantSoft);color:var(--want);border-color:var(--want)}
.seg button.on.save{background:var(--saveSoft);color:var(--save);border-color:var(--save)}
.sheetnote{font-size:13.5px;color:var(--muted);line-height:1.5;margin:-4px 0 18px}
.sheetact{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.sheetact button{border-radius:13px;padding:14px;font-size:16px;font-weight:550;min-height:50px}
.sheetact .undo{background:var(--sunken);color:var(--accent)}
.sheetact .remove{background:var(--sunken);color:var(--rose)}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--glass);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav button{padding:9px 2px 10px;font-size:11px;font-weight:500;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.toast{
  position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(6px);
  background:var(--text);color:var(--bg);border-radius:13px;padding:12px 18px;font-size:15px;font-weight:500;
  opacity:0;transition:opacity .18s ease, transform .18s ease;pointer-events:none;z-index:60;
  max-width:80%;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* passcode lock */
.lock{
  position:fixed;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 var(--gut) calc(40px + env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.lock.on{opacity:1;pointer-events:auto}
.lock h2{font-size:19px;font-weight:600;margin-bottom:6px}
.lock p{font-size:14.5px;color:var(--muted);margin:0 0 30px}
.dots{display:flex;gap:16px;margin-bottom:38px;height:15px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);transition:background .12s,border-color .12s}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.dots.bad i{border-color:var(--rose)}
.dots.bad i.f{background:var(--rose);border-color:var(--rose)}
.dots.shake{animation:sh .4s}
@keyframes sh{10%,90%{transform:translateX(-5px)}30%,70%{transform:translateX(7px)}50%{transform:translateX(-7px)}}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:16px;justify-content:center}
.pad button{
  height:76px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);
  font-size:29px;font-weight:400;letter-spacing:-0.02em;
}
.pad button:active{background:var(--sunken)}
.pad button.blank{background:none;box-shadow:none;pointer-events:none}
.pad button.wipe{font-size:16px;color:var(--muted);background:none;box-shadow:none}
.lockrow{display:flex;gap:10px;margin-top:22px}
.lockrow .ghost{margin-top:0}

h2.sec .editacc{font-size:13px;font-weight:500;color:var(--accent);padding:2px 6px}
.ychart{display:flex;align-items:flex-end;gap:5px;padding:18px 14px 12px;height:118px}
.ycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;height:100%}
.ycol i{display:block;width:100%;border-radius:4px 4px 2px 2px}
.ycol span{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--text)}

/* rental */
:root{ --let:#6E42B8; --letSoft:#F0E9FA; }
@media (prefers-color-scheme: dark){ :root{ --let:#B392E8; --letSoft:#241C36; } }
.tyear{display:flex;align-items:center;gap:8px;background:var(--letSoft);border-radius:15px;padding:8px 8px;margin-top:14px}
.tyear div{flex:1;text-align:center}
.tyear b{display:block;font-size:17px;font-weight:650;color:var(--let)}
.tyear small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.tyear button{width:44px;height:44px;border-radius:12px;color:var(--let);font-size:20px}
.tyear button:active{background:var(--surface)}
.hero.let .figure{color:var(--let)}
.letpanel{border:1.5px solid var(--letSoft)}
h2.sec .boxno{background:var(--letSoft);color:var(--let);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;letter-spacing:0}
nav{grid-template-columns:repeat(6,1fr)}
nav button{font-size:10px;gap:2px}
nav button svg{width:22px;height:22px}
nav button[data-v="letting"].on{color:var(--let)}
</style>
</head>
<body>

<header>
  <h1 id="title">This month</h1>
  <div class="monthnav">
    <button id="prev" aria-label="Previous month">&#8249;</button>
    <span class="num" id="mlabel"></span>
    <button id="next" aria-label="Next month">&#8250;</button>
  </div>
</header>

<main>
  <section class="view on" id="v-month"></section>
  <section class="view" id="v-accounts"></section>
  <section class="view" id="v-joint"></section>
  <section class="view" id="v-rule"></section>
  <section class="view" id="v-savings"></section>
  <section class="view" id="v-letting"></section>
</main>

<nav>
  <button data-v="month" class="on"><svg viewBox="0 0 24 24"><path d="M3 13h3.5l2.5 5 3.5-11 2.5 6h6"/></svg>Month</button>
  <button data-v="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/></svg>Accounts</button>
  <button data-v="joint"><svg viewBox="0 0 24 24"><circle cx="9.5" cy="9" r="3"/><circle cx="16.5" cy="10.5" r="2.3"/><path d="M4 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8M15.5 19.5c0-2.1 1.1-3.3 2.7-3.3s2.3 1.2 2.3 3.3"/></svg>Joint</button>
  <button data-v="rule"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5l6 4"/></svg>50/30/20</button>
  <button data-v="savings"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16"/><path d="M8 15.5l3.5-4.5 3 2.5L20 7"/></svg>Savings</button>
  <button data-v="letting"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>Rental</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<div class="lock on" id="lock">
  <h2>Enter your passcode</h2>
  <p>Four digits</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="blank"></button><button data-k="0">0</button>
    <button class="wipe" data-k="wipe">Delete</button>
  </div>
</div>

<script>
"use strict";

const store = (() => {
  const mem = {};
  const hasW = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
  let hasLS = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); hasLS = true; } catch (e) { hasLS = false; }
  return {
    async get(k){
      if (hasW) { try { const r = await window.storage.get(k); return r ? r.value : null; } catch(e){ return null; } }
      if (hasLS) return localStorage.getItem(k);
      return mem[k] || null;
    },
    async set(k,v){
      if (hasW) { try { await window.storage.set(k,v); return; } catch(e){} }
      if (hasLS) { try { localStorage.setItem(k,v); return; } catch(e){} }
      mem[k] = v;
    }
  };
})();

const KEY = "money.v1";
const EPOCH = "2000-01";
const CAT = { need:"Need", want:"Want", save:"Save" };
const CATP = { need:"Needs", want:"Wants", save:"Saving" };
const cvar = k => getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim() || "#888";

const uid = () => Math.random().toString(36).slice(2,9);
const money = n => "£" + (Math.round(n*100)/100).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "£" + Math.round(n).toLocaleString("en-GB");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function seed(){
  return {
    v:2, partner:"Partner",
    income:[{m:EPOCH,v:0}], otherIncome:[{m:EPOCH,v:0}],
    accounts:[
      {id:"a1",name:"Main account"},
      {id:"a2",name:"Subscriptions"},
      {id:"a3",name:"Personal"},
      {id:"a4",name:"Joint account"}
    ],
    groups:[
      {id:"g55",name:"Uneven split",splits:[{m:EPOCH,mine:55}]},
      {id:"g50",name:"Even split",splits:[{m:EPOCH,mine:50}]}
    ],
    transfers:[{m:EPOCH,mine:0,theirs:0}],
    payFrom:null,
    items:[], pots:[], balances:{},
    letting:{on:false, address:"", share:100, entries:[]},
    targets:{need:50,want:30,save:20}, lastBackup:null
  };
}

let S = seed(), view = "month";
let taxYear = null;
let cursor = new Date(); cursor.setDate(1);

const mkey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const mname = d => d.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
const mshort = d => d.toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
const shiftKey = (k,n) => { const [y,m] = k.split("-").map(Number); return mkey(new Date(y, m-1+n, 1)); };
const prettyKey = k => { const [y,m] = k.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"short",year:"2-digit"}); };
let K = mkey(cursor);

function at(series, m){
  if (!series || !series.length) return null;
  let out = null;
  series.slice().sort((a,b) => a.m < b.m ? -1 : 1).forEach(e => { if (e.m <= m) out = e; });
  return out;
}
function setAt(series, m, patch){
  const existing = series.find(e => e.m === m);
  if (existing) Object.assign(existing, patch);
  else series.push(Object.assign({}, at(series, m) || {}, patch, {m}));
  series.sort((a,b) => a.m < b.m ? -1 : 1);
}

async function save(){ await store.set(KEY, JSON.stringify(S)); }
function migrate(p){
  if (!p || p.v === 2) return p;
  const num = v => ({m:EPOCH, v:Number(v)||0});
  p.income = [num(p.income)];
  p.otherIncome = [num(p.otherIncome)];
  p.transfers = [{m:EPOCH, mine:Number((p.transfers||{}).mine)||0, theirs:Number((p.transfers||{}).theirs)||0}];
  (p.groups||[]).forEach(g => { g.splits = [{m:EPOCH, mine:g.mine != null ? g.mine : 50}]; delete g.mine; });
  (p.items||[]).forEach(it => { it.amounts = [{m:EPOCH, v:Number(it.amount)||0}]; it.from = null; it.to = null; delete it.amount; });
  delete p.future; p.v = 2; return p;
}
async function load(){
  const raw = await store.get(KEY);
  if (raw) { try { const p = migrate(JSON.parse(raw)); if (p && p.items) S = p; } catch(e){} }
  if (!S.letting) S.letting = {on:false, address:"", share:100, entries:[]};
  if (!S.payFrom) S.payFrom = null;
}

/* ---------- resolution as at month K ---------- */
const active = it => (!it.from || it.from <= K) && (!it.to || it.to >= K);
const amtIn = (it,m) => { const e = at(it.amounts, m); return e ? e.v : 0; };
const amt = it => amtIn(it, K);
const grp = id => S.groups.find(g => g.id === id);
const splitOf = g => { const e = at(g.splits, K); return e ? e.mine : 100; };
function myShare(it){
  if (!it.group) return amt(it);
  const g = grp(it.group);
  return amt(it) * (g ? splitOf(g) : 100) / 100;
}
const liveItems = () => S.items.filter(active);
function jointId(){
  const withGroup = S.items.find(i => i.group);
  if (withGroup) return withGroup.acct;
  const named = S.accounts.find(a => /joint/i.test(a.name));
  return named ? named.id : null;
}
const soloAccounts = () => S.accounts.filter(a => a.id !== jointId());
function payFrom(){
  const solo = soloAccounts();
  if (!solo.length) return null;
  if (S.payFrom && solo.some(a => a.id === S.payFrom)) return S.payFrom;
  return solo[0].id;
}
const income = () => { const a = at(S.income,K), b = at(S.otherIncome,K); return (a?a.v:0) + (b?b.v:0); };
const transfers = () => at(S.transfers,K) || {mine:0,theirs:0};
const jointCosts = () => liveItems().filter(i => i.acct === jointId()).reduce((s,i) => s + amt(i), 0);
const jointMine = () => liveItems().filter(i => i.acct === jointId()).reduce((s,i) => s + myShare(i), 0);
const soloTotal = id => liveItems().filter(i => i.acct === id).reduce((s,i) => s + myShare(i), 0);
/* the standing order physically leaves one of the solo accounts */
const transferFrom = id => (jointId() && payFrom() === id) ? transfers().mine : 0;
const accountOut = id => soloTotal(id) + transferFrom(id);

/* cash actually leaving my accounts: solo payments plus the standing order */
/* what you are actually on the hook for: your own bills plus your share of the joint ones */
const trueCost = () => liveItems().reduce((s,i) => s + myShare(i), 0);
function committed(){
  return soloAccounts().reduce((s,a) => s + accountOut(a.id), 0);
}
/* need / want / save, with any joint overpayment treated as an earmarked need */
function totals(){
  const t = {need:0,want:0,save:0};
  liveItems().forEach(it => { t[it.cat] += myShare(it); });
  const buffer = jointId() ? Math.max(transfers().mine - jointMine(), 0) : 0;
  t.buffer = buffer;
  t.need += buffer;
  t.all = t.need + t.want + t.save;
  t.left = income() - t.all;
  return t;
}
function withMonth(m, fn){ const keep = K; K = m; try { return fn(); } finally { K = keep; } }
function changes(){
  const prev = shiftKey(K,-1), out = [];
  S.items.forEach(it => {
    const wasOn = (!it.from || it.from <= prev) && (!it.to || it.to >= prev);
    const isOn = active(it);
    if (isOn && !wasOn) out.push({name:it.name, kind:"started", now:amt(it)});
    else if (!isOn && wasOn) out.push({name:it.name, kind:"ended", was:amtIn(it,prev)});
    else if (isOn && wasOn) {
      const a = amtIn(it,prev), b = amt(it);
      if (Math.abs(a-b) > 0.004) out.push({name:it.name, kind:"changed", was:a, now:b});
    }
  });
  const ia = at(S.income,prev), ib = at(S.income,K);
  if (ia && ib && Math.abs(ia.v-ib.v) > 0.004) out.push({name:"Salary", kind:"changed", was:ia.v, now:ib.v});
  return out;
}

/* ---------- savings, carried forward ---------- */
function balAt(potId, m){
  const months = Object.keys(S.balances).filter(x => x <= m).sort();
  for (let i = months.length-1; i >= 0; i--){
    const v = S.balances[months[i]][potId];
    if (v != null) return {v:Number(v), m:months[i]};
  }
  return null;
}
const potTotal = m => S.pots.reduce((s,p) => { const b = balAt(p.id,m); return s + (b ? b.v : 0); }, 0);
function savingsSeries(){
  const months = Object.keys(S.balances).sort().filter(m => m <= K);
  if (!months.length) return {labels:[],vals:[]};
  const labels = []; let m = months[0];
  while (m <= K && labels.length < 60) { labels.push(m); m = shiftKey(m,1); }
  return {labels, vals: labels.map(potTotal)};
}

/* ---------- letting: UK tax year, 6 April to 5 April ---------- */
const SA = {
  rent:   {box:"20", label:"Rent received",              kind:"in"},
  b24:    {box:"24", label:"Rent, rates, insurance, ground rents", kind:"exp"},
  b25:    {box:"25", label:"Repairs and maintenance",     kind:"exp"},
  b27:    {box:"27", label:"Legal, management and professional fees", kind:"exp"},
  b28:    {box:"28", label:"Services provided, including wages", kind:"exp"},
  b29:    {box:"29", label:"Other allowable expenses",    kind:"exp"},
  fin:    {box:"44", label:"Residential finance costs",   kind:"fin"},
  none:   {box:"\u2014", label:"Not allowable",            kind:"non"}
};
const SAORDER = ["b24","b25","b27","b28","b29"];

function taxYearOf(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return (m > 4 || (m === 4 && d >= 6)) ? y : y-1;
}
const tyLabel = y => y + "/" + String((y+1) % 100).padStart(2,"0");
const tyRange = y => [y + "-04-06", (y+1) + "-04-05"];
function currentTaxYear(){
  const d = new Date();
  return taxYearOf(d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"));
}
const shiftISOmonths = (iso,n) => {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1+n, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(Math.min(d,last)).padStart(2,"0");
};
/* expand recurring entries into dated occurrences inside one tax year */
function lettingRows(y){
  const [from,to] = tyRange(y), out = [];
  (S.letting.entries||[]).forEach(e => {
    if (e.every === "month"){
      let d = e.date, guard = 0;
      while (d <= to && guard++ < 400){
        if (d >= from && (!e.until || d <= e.until)) out.push({...e, date:d});
        d = shiftISOmonths(d,1);
      }
    } else if (e.date >= from && e.date <= to) out.push({...e});
  });
  return out.sort((a,b) => a.date < b.date ? -1 : 1);
}
function lettingSums(y){
  const rows = lettingRows(y), s = {rent:0, fin:0, none:0, exp:0, byBox:{}};
  SAORDER.forEach(k => s.byBox[k] = 0);
  rows.forEach(r => {
    if (r.cat === "rent") s.rent += r.amount;
    else if (r.cat === "fin") s.fin += r.amount;
    else if (r.cat === "none") s.none += r.amount;
    else { s.byBox[r.cat] = (s.byBox[r.cat]||0) + r.amount; s.exp += r.amount; }
  });
  const share = (S.letting.share == null ? 100 : S.letting.share) / 100;
  ["rent","fin","none","exp"].forEach(k => s[k] *= share);
  SAORDER.forEach(k => s.byBox[k] *= share);
  s.profit = s.rent - s.exp;
  s.reducer = s.fin * 0.2;
  s.rows = rows;
  return s;
}

function yearAhead(){
  if (!S.items.length) return "";
  const months = [], vals = [];
  for (let i = 0; i < 12; i++){
    const m = shiftKey(K,i);
    months.push(m);
    vals.push(withMonth(m, trueCost));
  }
  const max = Math.max(...vals), min = Math.min(...vals);
  if (max - min < 0.5) return "";
  const notes = [];
  for (let i = 1; i < 12; i++){
    const d = vals[i] - vals[i-1];
    if (Math.abs(d) > 0.5) notes.push({m:months[i], d});
  }
  const bars = vals.map((v,i) => {
    const h = max ? Math.max(6, (v/max)*72) : 6;
    return `<div class="ycol"><i style="height:${h.toFixed(0)}px;background:var(--${i===0?"accent":"need"});opacity:${i===0?1:.42}"></i>
      <span>${months[i].slice(5)}</span></div>`;
  }).join("");
  return `<h2 class="sec">What you are committed to<span class="amt">${money0(min)} to ${money0(max)}</span></h2>
    <div class="panel"><div class="ychart">${bars}</div>
    ${notes.length ? notes.slice(0,4).map(n => `<div class="kv"><span>${prettyKey(n.m)}</span>

    <div class="hint">Your own bills plus your share of the joint ones, month by month, before the rounding on your standing order. Give anything that stops, like nursery, a last month and it shows up here.</div>`;
}

function itemRows(list, showShare){
  const prev = shiftKey(K,-1);
  return list.map(it => {
    const g = it.group ? grp(it.group) : null;

    const moved = (!it.from || it.from <= prev) && Math.abs(was - amt(it)) > 0.004;
    const sub = [];
    if (showShare && g) sub.push(`your ${splitOf(g)}% is ${money(myShare(it))}`);
    if (moved) sub.push(`was ${money(was)}`);
    if (it.to) sub.push(`ends ${prettyKey(it.to)}`);
    return `<button class="row" data-open="${it.id}">
      <span class="name">${esc(it.name)}${sub.length ? `<small>${sub.join(" \u00B7 ")}</small>` : ""}</span>

    const actual = k === "want" ? t.want + Math.max(t.left,0) : t[k];
    const diff = actual - target, over = diff > 0;
    const cls = k === "save" ? (over ? "good" : "warn") : over ? (k === "need" ? "over" : "warn") : "good";
    return `<div class="panel" style="margin-bottom:10px"><div class="gauge">
      <div class="top">
        <div class="t">${CATP[k]}${k==="want"?" and what is left" : ""}</div>

      </div>
      <div class="pc num" style="color:var(--${k})">${pct(actual).toFixed(0)}%</div>
      <div class="track"><i style="width:${Math.min(pct(actual),100)}%;background:var(--${k})"></i>
        <u style="left:${Math.min(S.targets[k],100)}%"></u></div>
      <div class="foot"><span class="num">${money(actual)}</span><span class="num">target ${money(target)}</span></div>
    </div></div>`;
  }).join("");
  const needPct = pct(t.need);
  document.getElementById("v-rule").innerHTML = `
    ${splitBar(t)}
    ${gauges}
    <h2 class="sec">Your targets</h2>
    <div class="panel">
      ${["need","want","save"].map(k => `<div class="kv"><span>${CATP[k]}</span>

        : "Your needs fit inside 50%, so the standard targets work."}</div>
    </div>`;
  document.querySelectorAll("[data-t]").forEach(el => el.onchange = async e => {
    S.targets[e.target.dataset.t] = Number(e.target.value)||0; await save(); render();
  });
}

function spark(labels, vals){
  if (vals.length < 2) return "";
  const w = 340, h = 110, pad = 6;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const x = i => pad + i*(w-pad*2)/(vals.length-1);
  const y = v => h - pad - ((v-min)/span)*(h-pad*2);
  const pts = vals.map((v,i) => [x(i),y(v)]);
  let line = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++){
    const [px,py] = pts[i-1], [cx,cy] = pts[i], mx = (px+cx)/2;
    line += ` C${mx.toFixed(1)} ${py.toFixed(1)} ${mx.toFixed(1)} ${cy.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
  }
  const c = cvar("save");
  return `<svg class="spark" viewBox="0 0 ${w} ${h+18}" preserveAspectRatio="none" role="img" aria-label="Total savings over time">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".22"/><stop offset="100%" stop-color="${c}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line} L${x(vals.length-1).toFixed(1)} ${h} L${pad} ${h} Z" fill="url(#g)"/>
    <path d="${line}" stroke="${c}" fill="none" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(vals.length-1).toFixed(1)}" cy="${y(vals[vals.length-1]).toFixed(1)}" r="3.5" fill="${c}"/>
    <text x="${pad}" y="${h+15}" fill="${cvar("faint")}" font-size="11">${prettyKey(labels[0])}</text>
    <text x="${w-pad}" y="${h+15}" fill="${cvar("faint")}" font-size="11" text-anchor="end">${prettyKey(labels[labels.length-1])}</text>
  </svg>`;
}

function sheetBody(){

          `<option value="${a.id}"${payFrom()===a.id?" selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
      <div class="field"><label>New amount applies from</label>
        <input type="month" id="s_twhen" value="${K}"></div>

        ${tr.mine >= jointMine() ? `The extra ${money(tr.mine - jointMine())} builds buffer.` : `You are short by ${money(jointMine() - tr.mine)}.`}</div>`;
  }

  if (String(sheetFor).startsWith("__let:")){

    if (!e) return head("Not found");
    return head("Rental entry") + `

        <input type="number" step="0.01" inputmode="decimal" id="l_amt" value="${e.amount}"></div>
      <div class="field"><label>What was it</label><input type="text" id="l_desc" value="${esc(e.desc||"")}" placeholder="Boiler service"></div>
      <div class="field"><label>Counts as</label>
        <select id="l_cat">${Object.keys(SA).map(k =>
          `<option value="${k}"${e.cat===k?" selected":""}>Box ${SA[k].box} \u00B7 ${SA[k].label}</option>`).join("")}</select></div>
      <div class="sheetnote">${e.cat === "fin" ? "Enter the interest only. The capital you repay is not a cost, log that as Not allowable if you want it recorded."
        : e.cat === "none" ? "Capital repayments and improvements are not allowable against rental profit. Logged here for your own records only."

        <div class="field"><label>Repeats</label>

      </div>
      ${e.every ? `<div class="field"><label>Stops after</label><input type="date" id="l_until" value="${e.until||""}"></div>` : ""}
      <div class="sheetact"><button class="remove" id="l_del">Remove this entry</button></div>`;

    const id = sheetFor.slice(7);
    const acc = S.accounts.find(x => x.id === id);

      <div class="field"><label>Name</label><input type="text" id="s_aname" value="${esc(acc.name)}"></div>

        <button class="remove" id="s_adel">Remove this account</button></div>` : ""}`;

function wireSheet(){
  const $ = id => document.getElementById(id);
  const redraw = async () => { await save(); render(); const s = document.getElementById("sheet"); s.innerHTML = sheetBody(); wireSheet(); };
  $("sdone").onclick = closeSheet;

  if (sheetFor === "__transfer"){
    $("s_tamt").onchange = async e => {
      const w = $("s_twhen").value || K;
      setAt(S.transfers, w, {mine:Number(e.target.value)||0}); await redraw();
    };
    $("s_tfrom").onchange = async e => { S.payFrom = e.target.value; await redraw(); };
    return;
  }
  if (String(sheetFor).startsWith("__let:")){
    const id = sheetFor.split(":")[1];
    const e = (S.letting.entries||[]).find(x => x.id === id);
    if (!e) return;
    $("l_amt").onchange = async ev => { e.amount = Number(ev.target.value)||0; await redraw(); };
    $("l_desc").onchange = async ev => { e.desc = ev.target.value; await redraw(); };
    $("l_cat").onchange = async ev => { e.cat = ev.target.value; await redraw(); };
    $("l_date").onchange = async ev => { if (ev.target.value){ e.date = ev.target.value; await redraw(); } };
    $("l_every").onchange = async ev => { e.every = ev.target.value || null; if (!e.every) e.until = null; await redraw(); };
    if ($("l_until")) $("l_until").onchange = async ev => { e.until = ev.target.value || null; await redraw(); };
    $("l_del").onclick = async () => {
      if (!confirm("Remove this entry?")) return;
      S.letting.entries = S.letting.entries.filter(x => x.id !== id);
      closeSheet(); await save(); render();
    };
    return;
  }
  if (String(sheetFor).startsWith("__acct:")){
    const id = sheetFor.slice(7);
    const acc = S.accounts.find(x => x.id === id);
    $("s_aname").onchange = async e => { acc.name = e.target.value; await redraw(); };
    document.querySelectorAll("[data-sw]").forEach(b => b.onclick = async e => {
      acc.colour = e.currentTarget.dataset.sw; await redraw();
    });
    if ($("s_adel")) $("s_adel").onclick = async () => {
      if (!confirm("Remove " + acc.name + "?")) return;
      S.accounts = S.accounts.filter(x => x.id !== id);
      if (S.payFrom === id) S.payFrom = null;
      closeSheet(); await save(); render();
    };
    return;
  }
  const it = findItem(sheetFor);
  if (!it) return;
  $("s_amt").onchange = async e => {
    setAt(it.amounts, $("s_when").value || K, {v:Number(e.target.value)||0}); await redraw();
  };
  $("s_name").onchange = async e => { it.name = e.target.value; await redraw(); };
  $("s_from").onchange = async e => { it.from = e.target.value || null; await redraw(); };
  $("s_to").onchange = async e => { it.to = e.target.value || null; await redraw(); };
  document.querySelectorAll("[data-setcat]").forEach(b => b.onclick = async e => {
    it.cat = e.currentTarget.dataset.setcat; await redraw();
  });
  if ($("s_undo")) $("s_undo").onclick = async () => {
    it.amounts = it.amounts.filter(x => x.m !== K);
    if (!it.amounts.length) it.amounts = [{m:EPOCH, v:0}];
    await redraw(); toast("Back to the previous figure.");
  };
  $("s_del").onclick = async () => {
    if (!confirm("Remove " + it.name + "?")) return;
    S.items = S.items.filter(x => x.id !== it.id);
    closeSheet(); await save(); render();
  };
}

document.addEventListener("click", async e => {

  if (e.target.id === "scrim") { closeSheet(); return; }
  const addlet = e.target.closest("[data-addlet]");
  if (addlet){
    const today = new Date();
    const iso = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
    const inYear = taxYearOf(iso) === taxYear ? iso : tyRange(taxYear)[0];
    const ent = {id:uid(), date:inYear, desc:"", amount:0, cat:S.letting.entries.length ? "b25" : "rent", every:S.letting.entries.length ? null : "month", until:null};
    S.letting.entries.push(ent);
    await save(); render(); openSheet("__let:" + ent.id);
    return;
  }
  const add = e.target.closest("[data-add]");
  if (add) {
    const [acct, group] = add.dataset.add.split(":");
    const it = {id:uid(),acct,group:group||null,name:"New payment",cat:"need",from:K,to:null,amounts:[{m:K,v:0}]};

    return;

  const row = e.target.closest("[data-open]");
  if (row) { openSheet(row.dataset.open); return; }
});

async function exportData(){
  S.lastBackup = new Date().toISOString();
  await save();
  const blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "money-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Save it to iCloud Drive.");
  render();
}
async function applyBackup(text){
  const p = migrate(JSON.parse(text));
  if (!p || !p.items) throw new Error("bad");
  S = p; await save(); render(); toast("Restored.");
}
async function importData(){
  const text = prompt("Paste a backup");
  if (!text) return;
  try { await applyBackup(text); } catch(e){ toast("That backup could not be read."); }
}


/* ---------- PDF: a small writer, no libraries, base-14 Helvetica ---------- */
const W = (() => {
  const t = {};
  " !\"#$%&'()*+,-./".split("").forEach((c,i) => t[c] = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278][i]);
  "0123456789".split("").forEach(c => t[c] = 556);
  ":;<=>?@".split("").forEach((c,i) => t[c] = [278,278,584,584,584,556,1015][i]);
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach((c,i) => t[c] =
    [667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611][i]);
  "[\\]^_`".split("").forEach((c,i) => t[c] = [278,278,278,469,556,333][i]);
  "abcdefghijklmnopqrstuvwxyz".split("").forEach((c,i) => t[c] =
    [556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500][i]);
  "{|}~".split("").forEach((c,i) => t[c] = [334,260,334,584][i]);
  t["\u00A3"] = 556; t["\u00B7"] = 278; t["\u2019"] = 191; t["\u2013"] = 556; t["\u2212"] = 584;
  return t;
})();
const textWidth = (s, size) => {
  let w = 0;
  for (const c of String(s)) w += (W[c] != null ? W[c] : 500);
  return w * size / 1000;
};
/* map to WinAnsi single bytes, drop anything we cannot encode */
function winansi(s){
  const map = {"\u00A3":0xA3,"\u00B7":0xB7,"\u2019":0x92,"\u2018":0x91,"\u201C":0x93,"\u201D":0x94,
               "\u2013":0x96,"\u2014":0x97,"\u2212":0x2D,"\u00A0":0x20,"\u00E9":0xE9,"\u00A9":0xA9};
  let out = "";
  for (const c of String(s)){
    const n = c.charCodeAt(0);
    if (n >= 32 && n <= 126) out += c;
    else if (map[c] != null) out += String.fromCharCode(map[c]);
    else if (n >= 160 && n <= 255) out += c;
    else out += " ";
  }
  return out;
}
const pdfEsc = s => winansi(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");

function buildPdf(doc){
  const PW = 595.28, PH = 841.89, M = 52;
  const pages = [];
  let ops = [], y = 0, pageNo = 0;

  const startPage = () => {
    pageNo++;
    ops = [];
    y = PH - M;
    if (pageNo === 1){
      ops.push(`BT 0 g /F2 20 Tf 1 0 0 1 ${M} ${y-6} Tm (${pdfEsc(doc.title)}) Tj ET`);
      y -= 26;
      if (doc.subtitle){
        ops.push(`BT 0.38 g /F1 11 Tf 1 0 0 1 ${M} ${y-4} Tm (${pdfEsc(doc.subtitle)}) Tj ET`);
        y -= 22;
      }
      y -= 6;
    }
  };
  const room = need => { if (y - need < M + 34){ pages.push(ops); startPage(); } };
  const rule = () => {
    ops.push(`0.86 G 0.6 w ${M} ${y.toFixed(1)} m ${(PW-M).toFixed(1)} ${y.toFixed(1)} l S`);
  };
  const left = (s, size, font, grey, dy) => {
    ops.push(`BT ${grey} g /${font} ${size} Tf 1 0 0 1 ${M} ${(y-dy).toFixed(1)} Tm (${pdfEsc(s)}) Tj ET`);
  };
  const right = (s, size, font, grey, dy) => {
    const x = PW - M - textWidth(s, size);
    ops.push(`BT ${grey} g /${font} ${size} Tf 1 0 0 1 ${x.toFixed(1)} ${(y-dy).toFixed(1)} Tm (${pdfEsc(s)}) Tj ET`);
  };
  const wrap = (s, size, width) => {
    const words = String(s).split(/\s+/), lines = []; let cur = "";
    words.forEach(w => {
      const test = cur ? cur + " " + w : w;
      if (textWidth(test, size) > width && cur){ lines.push(cur); cur = w; } else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  };

  startPage();
  doc.blocks.forEach(b => {
    if (b.type === "section"){
      room(40);
      y -= 16;
      left(b.text, 10, "F2", "0.42", 0);
      y -= 8;
      rule();
      y -= 4;
    } else if (b.type === "note"){
      const lines = wrap(b.text, 9.5, PW - M*2);
      room(lines.length * 13 + 8);
      y -= 6;
      lines.forEach(l => { left(l, 9.5, "F1", "0.45", 0); y -= 13; });
    } else {
      const hasSub = !!b.sub;
      room(hasSub ? 34 : 24);
      y -= 16;
      const size = b.strong ? 11 : 10.5;
      left(b.label, size, b.strong ? "F2" : "F1", b.strong ? "0" : "0.15", 0);
      if (b.value != null) right(String(b.value), size, "F2", b.grey || "0", 0);
      if (hasSub){ y -= 12; left(b.sub, 8.8, "F1", "0.5", 0); }
      y -= 7;
      if (!b.last) rule();
    }
  });
  pages.push(ops);

  /* footers */
  const stamp = doc.stamp || "";
  const streams = pages.map((o,i) => {
    const f = `BT 0.55 g /F1 8.5 Tf 1 0 0 1 ${M} ${M-14} Tm (${pdfEsc(stamp)}) Tj ET`;
    const lbl = `${i+1} of ${pages.length}`;
    const g = `BT 0.55 g /F1 8.5 Tf 1 0 0 1 ${(PW-M-textWidth(lbl,8.5)).toFixed(1)} ${M-14} Tm (${pdfEsc(lbl)}) Tj ET`;
    return o.concat([f,g]).join("\n");
  });

  /* assemble */
  const objs = [];
  const nPages = streams.length;
  const pageIds = streams.map((_,i) => 4 + i*2);
  objs[1] = `<< /Type /Catalog /Pages 2 0 R >>`;
  objs[2] = `<< /Type /Pages /Kids [${pageIds.map(id => id+" 0 R").join(" ")}] /Count ${nPages} >>`;
  objs[3] = `<< /Font << /F1 ${4+nPages*2} 0 R /F2 ${5+nPages*2} 0 R >> >>`;
  streams.forEach((s,i) => {
    objs[pageIds[i]] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources 3 0 R /Contents ${pageIds[i]+1} 0 R >>`;
    objs[pageIds[i]+1] = `<< /Length ${s.length} >>\nstream\n${s}\nendstream`;
  });
  objs[4+nPages*2] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[5+nPages*2] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;

  let out = "%PDF-1.4\n";
  const offsets = [];
  for (let i = 1; i < objs.length; i++){
    offsets[i] = out.length;
    out += `${i} 0 obj\n${objs[i]}\nendobj\n`;
  }
  const xref = out.length;
  out += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let i = 1; i < objs.length; i++){
    out += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  }
  out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;

  const bytes = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
  return new Blob([bytes], {type:"application/pdf"});
}

/* ---------- what each tab puts in the document ---------- */
function docFor(v){
  const stamp = "Made " + new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const t = totals(), jid = jointId(), tr = transfers();
  const B = [];
  const sec = text => B.push({type:"section",text});
  const row = (label,value,sub,strong,grey) => B.push({type:"row",label,value,sub,strong,grey});
  const note = text => B.push({type:"note",text});

  if (v === "month"){
    const cash = committed();
    sec("Money in");
    const a = at(S.income,K), b = at(S.otherIncome,K);
    row("Salary after tax", money(a?a.v:0));
    if (b && b.v) row("Other income", money(b.v));
    sec("Leaving your accounts");
    soloAccounts().forEach(x => row(x.name, money(accountOut(x.id)),
      transferFrom(x.id) ? "includes " + money(transferFrom(x.id)) + " to the joint account" : null));
    row("Total out", money(cash), null, true);
    sec("How it splits");
    row("Needs", money(t.need));
    row("Wants", money(t.want));
    row("Saving", money(t.save));
    row("Left to spend", money(income()-cash), null, true);
    const ch = changes();
    if (ch.length){
      sec("Different from " + prettyKey(shiftKey(K,-1)));
      ch.forEach(c => row(c.name,
        c.kind === "started" ? "starts at " + money(c.now) :
        c.kind === "ended" ? "ends, was " + money(c.was) :
        money(c.was) + " to " + money(c.now)));
    }
    return {title: mname(cursor), subtitle: money(income()-cash) + " left to spend", blocks:B, stamp};
  }

  if (v === "accounts"){
    sec("Money in during " + mname(cursor));
    const a = at(S.income,K), b = at(S.otherIncome,K);
    row("Salary after tax", money(a?a.v:0));
    row("Other income", money(b?b.v:0));
    soloAccounts().forEach(x => {
      const list = liveItems().filter(i => i.acct === x.id).sort((p,q) => amt(q)-amt(p));
      sec(x.name + "  \u00B7  " + money(accountOut(x.id)));
      list.forEach(i => row(i.name, money(amt(i)), CAT[i.cat]));
      if (transferFrom(x.id)) row("Standing order to " + S.accounts.find(y=>y.id===jid).name,
        money(transferFrom(x.id)), "your share of those bills is " + money(jointMine()));
      row("Subtotal", money(accountOut(x.id)), null, true);
    });
    row("Total leaving your accounts", money(committed()), null, true);
    return {title:"Accounts", subtitle: mname(cursor), blocks:B, stamp};
  }

  if (v === "joint"){
    const full = jointCosts(), mine = jointMine();
    sec("Standing orders in");
    row("You send", money(tr.mine));
    row(S.partner + " sends", money(tr.theirs));
    row("Buffer built this month", money(tr.mine + tr.theirs - full), null, true);
    S.groups.forEach(g => {
      const list = liveItems().filter(i => i.group === g.id).sort((p,q) => amt(q)-amt(p));
      if (!list.length) return;
      const tot = list.reduce((s,i) => s + amt(i), 0), pc = splitOf(g);
      sec(g.name + "  ·  " + money(tot));
      list.forEach(i => row(i.name, money(amt(i))));
      row("You, " + pc + "%", money(tot*pc/100), null, true);
      row(S.partner + ", " + (100-pc) + "%", money(tot*(100-pc)/100), null, true);
    });
    sec("Altogether");
    row("Leaving the joint account", money(full));
    row("You owe", money(mine), null, true);
    row(S.partner + " owes", money(full-mine), null, true);
    return {title:"Joint account", subtitle: mname(cursor) + "  ·  " + money(full) + " in shared costs", blocks:B, stamp};
  }

  if (v === "rule"){
    const inc = income();
    const pct = n => inc ? (n/inc*100).toFixed(0) + "%" : "0%";
    sec("Against your targets");
    ["need","want","save"].forEach(k => {
      const target = inc * S.targets[k]/100;
      const actual = k === "want" ? t.want + Math.max(t.left,0) : t[k];
      const diff = actual - target;
      row(CATP[k], pct(actual), money(actual) + " against a target of " + money(target) + ", " +
        (diff >= 0 ? "over by " : "under by ") + money(Math.abs(diff)));
    });
    sec("Targets in use");
    ["need","want","save"].forEach(k => row(CATP[k], S.targets[k] + "%"));
    if (inc) note("Needs are " + pct(t.need) + " of what comes in. " +
      (t.buffer > 0.004 ? "That includes " + money(t.buffer) + " of joint account buffer, which is earmarked for bills rather than spent." : ""));
    return {title:"50/30/20", subtitle: mname(cursor), blocks:B, stamp};
  }

  if (v === "letting"){
    const y = taxYear, s = lettingSums(y), L = S.letting;
    const fmt = iso => { const [yy,mm,dd] = iso.split("-"); return dd + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][mm-1] + " " + yy; };
    const shr = (L.share==null?100:L.share)/100;
    if (L.address) { sec("Property"); row("Address", ""); note(L.address); }
    if (shr < 1) note("Figures shown are your " + (shr*100) + "% share.");
    const block = k => {
      const rows = s.rows.filter(r => r.cat === k);
      if (!rows.length) return;
      sec("Box " + SA[k].box + "  \u00B7  " + SA[k].label);
      rows.forEach(r => row(r.desc || SA[k].label, money(r.amount * shr), fmt(r.date) + (r.every==="month" ? ", monthly" : "")));
      row("Total", money(rows.reduce((n,r)=>n+r.amount,0) * shr), null, true);
    };
    block("rent"); SAORDER.forEach(block); block("fin"); block("none");
    sec("Summary for the return");
    row("Box 20, total rents", money(s.rent));
    SAORDER.forEach(k => { if (s.byBox[k] > 0.004) row("Box " + SA[k].box + ", " + SA[k].label.toLowerCase(), money(s.byBox[k])); });
    row("Allowable expenses", money(s.exp), null, true);
    row("Taxable profit", money(s.profit), null, true);
    if (s.fin > 0.004){
      row("Box 44, residential finance costs", money(s.fin), null, true);
      row("Basic rate reducer this produces", money(s.reducer), "20% of box 44, applied against your tax bill");
    }
    if (s.none > 0.004) note("Not allowable, recorded for your own reference only: " + money(s.none) + ". Capital repayments and improvements do not reduce rental profit.");
    note("Prepared from your own records. Mortgage interest sits in box 44 rather than the expense boxes because of the Section 24 restriction. Check the figures before they go anywhere near a return.");
    return {title:"Rental, " + tyLabel(y), subtitle:"6 April " + y + " to 5 April " + (y+1), blocks:B, stamp};
  }

  const pk = shiftKey(K,-1);
  const entered = S.balances[K] || {};
  sec("Balances");
  S.pots.forEach(p => {
    const bal = balAt(p.id,K), q = balAt(p.id,pk);
    const fresh = entered[p.id] != null;
    const d = (bal && q) ? bal.v - q.v : null;
    row(p.name, bal ? money(bal.v) : "not recorded",
      !bal ? null : fresh ? (d !== null && Math.abs(d) > 0.004
        ? (d >= 0 ? "up " : "down ") + money(Math.abs(d)) + " since " + prettyKey(pk) : "no change")
        : "carried from " + prettyKey(bal.m));
  });
  const now = potTotal(K), was = potTotal(pk);
  row("Total held", money(now), was ? ((now>=was?"up ":"down ") + money(Math.abs(now-was)) + " on " + prettyKey(pk)) : null, true);
  sec("Paid in from your bills");
  row("Pensions, ISAs and debt", money(liveItems().filter(i => i.cat === "save").reduce((s,i) => s + myShare(i), 0)));
  return {title:"Savings", subtitle: mname(cursor) + "  ·  " + money0(now) + " held", blocks:B, stamp};
}

async function sharePdf(){
  let blob, doc;
  try { doc = docFor(view); blob = buildPdf(doc); }
  catch(e){ toast("Could not build the PDF."); return; }
  const name = doc.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-" + K + ".pdf";
  const file = new File([blob], name, {type:"application/pdf"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:doc.title}); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Saved. Share it from Files.");
}


/* ---------- passcode: a privacy screen, not encryption ---------- */
const DEFAULT_PIN = {sha:"680f37711d33be1435526b8d971b87d8de07a8371958dbdf2100909286104890", fb:"f27647d43"};
const PINKEY = "money.pin";
let entry = "", locked = true, hiddenAt = 0;

async function hashPin(s){
  const salted = "money:" + s;
  if (typeof crypto !== "undefined" && crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salted));
    return {alg:"sha", value:[...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,"0")).join("")};
  }
  let h = 5381;
  for (const c of salted) h = ((h*33) ^ c.charCodeAt(0)) >>> 0;
  return {alg:"fb", value:"f" + h.toString(16)};
}
async function checkPin(s){
  const got = await hashPin(s);
  const stored = await store.get(PINKEY);
  if (stored){
    try { const o = JSON.parse(stored); if (o[got.alg]) return o[got.alg] === got.value; } catch(e){}
  }
  return DEFAULT_PIN[got.alg] === got.value;
}
function paintDots(bad){
  const d = document.getElementById("dots");
  d.className = "dots" + (bad ? " bad shake" : "");
  d.innerHTML = [0,1,2,3].map(i => `<i class="${i < entry.length ? "f" : ""}"></i>`).join("");
  if (bad) setTimeout(() => { entry = ""; paintDots(false); }, 420);
}
function lockUp(){
  locked = true; entry = "";
  document.getElementById("lock").classList.add("on");
  document.body.classList.add("locked");
  paintDots(false);
}
function unlock(){
  locked = false; entry = "";
  document.getElementById("lock").classList.remove("on");
  document.body.classList.remove("locked");
}
async function tapKey(k){
  if (k === "wipe"){ entry = entry.slice(0,-1); paintDots(false); return; }
  if (entry.length >= 4) return;
  entry += k;
  paintDots(false);
  if (entry.length === 4){
    if (await checkPin(entry)) unlock();
    else paintDots(true);
  }
}
function wireLock(){
  document.querySelectorAll("#pad button[data-k]").forEach(b => {
    b.onclick = () => tapKey(b.dataset.k);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (!locked && hiddenAt && Date.now() - hiddenAt > 3*60*1000) lockUp();
  });
}
async function changePin(){
  const cur = prompt("Current passcode");
  if (cur === null) return;
  if (!await checkPin(cur)){ toast("That is not the current passcode."); return; }
  const next = prompt("New four digit passcode");
  if (next === null) return;
  if (!/^\d{4}$/.test(next)){ toast("It needs to be four digits."); return; }
  const h = await hashPin(next);
  await store.set(PINKEY, JSON.stringify({[h.alg]: h.value}));
  toast("Passcode changed.");
}

wireLock();
lockUp();
load().then(render);
